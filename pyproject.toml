[project]
name = "terrain-weather-ml"
version = "0.1.0"
description = "Cross-domain terrain-weather physics model: pre-trained on dense Alpine networks, fine-tuned for mountain terrain micro-weather prediction"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=2.0",
    "xarray>=2024.9",
    "rasterio>=1.4",
    "duckdb>=1.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "polars>=1.6",
    "pydantic>=2.9",
    "huggingface-hub>=0.25",
    "safetensors>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "jupyter>=1.1",
    "matplotlib>=3.9",
]
backbone = [
    "diffusers>=0.31",
]
downscaling = [
    "windninjapy>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
